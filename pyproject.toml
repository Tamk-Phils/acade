[project]
name = "acadformat"
version = "2.3.0"
description = "AcadFormat Academic Identity Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "python-multipart>=0.0.6",
    "python-docx>=1.1.0",
    "pdf2image>=1.16.3",
    "pypdf>=3.17.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
